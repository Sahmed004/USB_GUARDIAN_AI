name: Build USB Guardian AI for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop.py"
      - "app.py"
      - "file_scanner.py"
      - "usb_detection/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --windowed --onedir --name "USB Guardian AI" --add-data "app.py;." --add-data "usb_detection;usb_detection" --collect-all streamlit --collect-all webview --hidden-import usb_detection.windows --hidden-import usb_detection.macos desktop.py

      - name: Save Windows build
        uses: actions/upload-artifact@v4
        with:
          name: USB-Guardian-AI-Windows
          path: "dist/USB Guardian AI/"
